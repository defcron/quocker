name: json-test
services:
  app:
    image: "alpine:latest"
    cpus: 2
    mem_limit: 1G
    privileged: true
    command:
      - echo
      - "true"
      - "$${LITERAL}"
    environment:
      QUOCKER_DEFAULT_SET: ${QUOCKER_CONFIG_INTERPOLATION_SET:-fallback}
      QUOCKER_DEFAULT_MISSING: ${QUOCKER_CONFIG_INTERPOLATION_MISSING:-fallback}
      QUOCKER_DEFAULT_EMPTY: ${QUOCKER_CONFIG_INTERPOLATION_EMPTY:-fallback}
      QUOCKER_DEFAULT_SET_NO_COLON: ${QUOCKER_CONFIG_INTERPOLATION_SET-fallback}
      QUOCKER_DEFAULT_MISSING_NO_COLON: ${QUOCKER_CONFIG_INTERPOLATION_MISSING-fallback}
      QUOCKER_DEFAULT_EMPTY_NO_COLON: ${QUOCKER_CONFIG_INTERPOLATION_EMPTY-fallback}
      QUOCKER_PLUS_SET: ${QUOCKER_CONFIG_INTERPOLATION_SET+yes}
      QUOCKER_PLUS_MISSING: ${QUOCKER_CONFIG_INTERPOLATION_MISSING+yes}
      QUOCKER_PLUS_EMPTY: ${QUOCKER_CONFIG_INTERPOLATION_EMPTY+yes}
      QUOCKER_COLON_PLUS_SET: ${QUOCKER_CONFIG_INTERPOLATION_SET:+yes}
      QUOCKER_COLON_PLUS_MISSING: ${QUOCKER_CONFIG_INTERPOLATION_MISSING:+yes}
      QUOCKER_COLON_PLUS_EMPTY: ${QUOCKER_CONFIG_INTERPOLATION_EMPTY:+yes}
